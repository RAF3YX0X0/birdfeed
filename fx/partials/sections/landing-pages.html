<section class="nx nx--bento nx--light nx--split" data-nx-for="4" data-nx-h="A page that looks nice and a page that gets results are two ">
  <div class="nx__in">
    <div class="nx__side"><header class="nx__head ">
      
      <h2 class="nx__title">A page that looks nice and a page that gets results are two <em>different things</em></h2>
      
      
    </header></div>
    <div class="nx__body"><div class="nx-bento nx-bento--6">
      <article class="nx-card nx-card--lead nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">01</span></div>
        
        
        <h3>Design is done before anyone writes a word</h3>
        <p>Someone picks a template, moves sections around, then adds copy at the end to fill the gaps. The page looks polished but says nothing that makes a visitor stop and think &quot;this is for me.&quot;</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">02</span></div>
        
        
        <h3>We write first, then design around the words</h3>
        <p>Every headline, every section, every button is written before we open a design tool. The layout is built to make the message as easy to read as possible, not the other way around.</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">03</span></div>
        
        
        <h3>You have to scroll to find out what it is</h3>
        <p>The first thing a visitor sees should tell them exactly what they get and why they should want it. If they have to dig for that, most will not bother.</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">04</span></div>
        
        
        <h3>The point is clear in the first five seconds</h3>
        <p>We lead with the one thing your visitor cares most about, the outcome they want, so they know immediately that they are in the right place.</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">05</span></div>
        
        
        <h3>The page tries to do too many things</h3>
        <p>Multiple buttons, links back to the homepage, a blog section, a full menu. Every extra thing to click is one more reason not to do the thing you actually want them to do.</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">06</span></div>
        
        
        <h3>One page, one thing to do</h3>
        <p>Every section is there for a reason. No nav bar pulling people away, no extra links, no distractions, just a clear path to the one action you want them to take.</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">07</span></div>
        
        
        <h3>It does not work properly on a phone</h3>
        <p>More than half of all ad clicks happen on mobile. A page that was built for a desktop screen and just squeezed down loses most of that traffic before it even loads properly.</p>
        
        
      </article>
      <article class="nx-card nx-card--neg" data-nx-item>
        <div class="nx-card__top"><span class="nx-pains__x"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="nx-card__n">08</span></div>
        
        
        <h3>Looks great on every screen</h3>
        <p>We design for desktop and mobile at the same time, and we test both before handing anything over. You get two complete design files, not one shrunk down.</p>
        
        
      </article>
    </div></div>
  </div>
</section>
