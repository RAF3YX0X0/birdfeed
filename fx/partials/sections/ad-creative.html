<section class="nx nx--bento nx--stone" data-nx-for="3" data-nx-h="Different formats.Different jobs in the funnel.">
  <div class="nx__in">
    <div class="nx__side"><header class="nx__head ">
      
      <h2 class="nx__title">Different formats.<br>Different jobs in the <em>funnel.</em></h2>
      <p class="nx__lede">Not every ad creative does the same thing. Knowing where each format sits helps you allocate budget smarter, and tells you which format to reach for when a campaign is underperforming.</p>
      
    </header></div>
    <div class="nx__body"><div class="nx-bento nx-bento--3">
      <article class="nx-card nx-card--lead" data-nx-item>
        <div class="nx-card__top"><span class="nx-card__n">01</span></div>
        <span class="nx-card__tag">Top of funnel, Awareness</span>
        
        <h3>Video Ads</h3>
        <p>Cold audiences meet your brand here. A great vertical video introduces, demonstrates, and builds your warm retargeting pool while it runs.</p>
        <ul class="nx-bul"><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Best for cold audiences and broad top-of-funnel campaigns</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Ideal when your product needs context before a buying decision</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Feeds warm retargeting audiences for lower-funnel ads</span></li></ul>
        
      </article>
      <article class="nx-card" data-nx-item>
        <div class="nx-card__top"><span class="nx-card__n">02</span></div>
        <span class="nx-card__tag">Mid funnel, Consideration</span>
        
        <h3>UGC Videos</h3>
        <p>Looks and reads like an editorial piece, but guides the reader toward your product. Great for people not yet ready to buy when they first click.</p>
        <ul class="nx-bul"><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Best for warm retargeting audiences who need a trust signal</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Also strong at top of funnel in social-proof-driven categories</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Pairs naturally with video ads, introduce the brand, then prove it</span></li></ul>
        
      </article>
      <article class="nx-card" data-nx-item>
        <div class="nx-card__top"><span class="nx-card__n">03</span></div>
        <span class="nx-card__tag">Bottom of funnel, Conversion</span>
        
        <h3>Static Ads</h3>
        <p>Formatted like a &quot;top 5&quot; or &quot;best of&quot; article. Feels like editorial content rather than an ad, so visitors read more and trust more before your offer.</p>
        <ul class="nx-bul"><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Best for retargeting and high-intent audiences</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Fastest and most cost-effective format for creative volume testing</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>•Built for offers, promotions, and direct calls to action</span></li></ul>
        
      </article>

</section>

<section class="nx nx--bento nx--stone" data-nx-for="7" data-nx-h="The principles we apply to every ad we make.">
  <div class="nx__in">
    <div class="nx__side"><header class="nx__head ">
      
      <h2 class="nx__title">The principles we apply to every ad <em>we make.</em></h2>
      <p class="nx__lede">These are not opinions. They come from studying thousands of high-performing ads across every category, and they inform every brief we write and every asset we deliver.</p>
      
    </header></div>
    <div class="nx__body"><div class="nx-bento nx-bento--3">
      <article class="nx-card nx-card--lead" data-nx-item>
        <div class="nx-card__top"><span class="nx-card__n">01</span></div>
        <span class="nx-card__tag">The first three seconds</span>
        
        <h3>The hook is not a headline. It is the entire ad.</h3>
        <p>Research consistently shows users decide whether to keep scrolling within the first one to two seconds. Our copywriters work from tested hook frameworks, and we develop multiple hook variants per creative so you can test which angle resonates fastest.</p>
        <ul class="nx-bul"><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Problem-reveal hooks for high-awareness audiences</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Curiosity-gap hooks for cold traffic</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Social proof opens for mid-funnel</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Contrast and transformation for product demos</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Bold direct-claim hooks for purchase intent</span></li><li><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Native-style openers for UGC placements</span></li></ul>
        
      </article>
      <article class="nx-card" data-nx-item>
        <div class="nx-card__top"><span class="nx-card__n">02</span></div>
        <span class="nx-card__tag">Graphic design for paid social</span>
        
        <h3>Designed to interrupt. Built to hold attention.</h3>
        <p>Good ad design is intentionally disruptive, high-contrast compositions that feel different from the organic content surrounding them. Layouts that direct the eye toward the key message before anything else registers. Typography weighted and sized for silent-view environments where someone sees the text before they hear the audio.</p>
        
        
      </article>
      <article class="nx-card" data-nx-item>
        <div class="nx-card__top"><span class="nx-card__n">03</span></div>
        <span class="nx-card__tag">Video editing as performance strategy</span>
        
        <h3>Pacing, captions, and sound design as conversion levers.</h3>
        <p>Sharp cuts that maintain attention across the full run time. Bold on-screen subtitles that carry the message clearly when sound is off, which is how most people watch. Music and sound design chosen to reinforce the emotional tone of the hook, with motion graphics that emphasise the key benefit at the right moment.</p>
        
        
      </article>
    </div></div>
  </div>
</section>
