<section class="pf" aria-labelledby="pf-title" data-fx-skip>
  <div class="sx-head">
    <span class="sx-eyebrow"><i></i>Our portfolio</span>
    <h2 class="sx-title" id="pf-title">Real creatives, <em>zero</em> AI slop</h2>
    <p class="sx-sub">Browse the posts, videos and UGC our team has made for businesses like yours. Filter by format and industry.</p>
  </div>
  <div class="pf__shop">
    <aside class="pf__side" aria-label="Filters">
      <div class="pf-group">
        <p class="pf-group__k">Format</p>
        <div class="pf-formats" role="tablist" aria-label="Format">
          <button class="pf-format" type="button" role="tab" aria-selected="true" data-format="posts" data-svc="Social Media Posts" data-svc-price="99" data-svc-href="/social-media-management/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span>Posts</span><em class="pf-n"></em></button>
          <button class="pf-format" type="button" role="tab" aria-selected="false" data-format="videos" data-svc="Short-Form Videos" data-svc-price="149" data-svc-href="/short-form-video/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="15" height="14" rx="3"/><path d="m17 10 5-3v10l-5-3"/></svg><span>Videos</span><em class="pf-n"></em></button>
          <button class="pf-format" type="button" role="tab" aria-selected="false" data-format="ugc" data-svc="UGC Videos" data-svc-price="599" data-svc-href="/ugc-videos/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg><span>UGC</span><em class="pf-n"></em></button>
        </div>
      </div>
      <div class="pf-group pf-group--ind">
        <p class="pf-group__k">Industry</p>
        <ul class="pf-inds"></ul>
        <p class="pf-group__note">UGC creators film for every industry.</p>
      </div>
      <a class="pf-side__cta" href="/examples/">See every example <span aria-hidden="true">→</span></a>
    </aside>
    <div class="pf__main">
      <div class="pf__bar">
        <p class="pf__count" aria-live="polite"></p>
        <div class="pf__pills"></div>
        <div class="pf__view" role="group" aria-label="Grid size">
          <button type="button" class="pf-viewbtn" data-cols="3" aria-pressed="false" aria-label="Large tiles"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
          <button type="button" class="pf-viewbtn" data-cols="4" aria-pressed="true" aria-label="Small tiles"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1.5"/><rect x="9.5" y="3" width="5" height="5" rx="1.5"/><rect x="16" y="3" width="5" height="5" rx="1.5"/><rect x="3" y="9.5" width="5" height="5" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.5"/><rect x="16" y="9.5" width="5" height="5" rx="1.5"/><rect x="3" y="16" width="5" height="5" rx="1.5"/><rect x="9.5" y="16" width="5" height="5" rx="1.5"/><rect x="16" y="16" width="5" height="5" rx="1.5"/></svg></button>
        </div>
      </div>
      <div class="pf__grid" data-cols="4"></div>
      <div class="pf__more">
        <div class="pf__progress" aria-hidden="true"><i></i></div>
        <p class="pf__shown"></p>
        <button class="hx-btn hx-btn--white pf__load" type="button">Load more</button>
      </div>
      <noscript><p class="pf__noscript"><a href="/examples/">Browse all our examples →</a></p></noscript>
    </div>
  </div>
  <dialog class="pf-qv" aria-label="Quick view">
    <div class="pf-qv__in">
      <div class="pf-qv__media"></div>
      <div class="pf-qv__info">
        <p class="pf-qv__k"></p>
        <h3 class="pf-qv__title"></h3>
        <p class="pf-qv__cap"></p>
        <dl class="pf-qv__facts"></dl>
        <div class="pf-qv__buy">
          <p class="pf-qv__svc"><span>Made with</span><a class="pf-qv__svc-name" href="/pricing/"></a><em class="pf-qv__svc-price"></em></p>
          <div class="pf-qv__ctas"></div>
        </div>
        <div class="pf-qv__nav">
          <button type="button" class="pf-qv__prev" aria-label="Previous">←</button>
          <span class="pf-qv__pos"></span>
          <button type="button" class="pf-qv__next" aria-label="Next">→</button>
        </div>
      </div>
      <button type="button" class="pf-qv__close" aria-label="Close" autofocus>×</button>
    </div>
  </dialog>
</section>
